<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSync - Smart Task Planner</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-group">
                <span class="logo-icon">⛅</span>
                <div>
                    <h1>WeatherSync</h1>
                    <p class="subtitle">Personal Weather & Task Planning App</p>
                </div>
            </div>
            
            <!-- Search Bar with Instant Autocomplete Dropdown & Datalist -->
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <input type="text" id="cityInput" list="cityDatalist" placeholder="Type city name (e.g. Berlin, Paris)..." value="Berlin" autocomplete="off">
                    <datalist id="cityDatalist"></datalist>
                    <ul id="suggestionsList" class="suggestions-list hidden"></ul>
                </div>
                <button id="searchBtn" aria-label="Search city weather">Fetch Weather</button>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="main-grid">
            <!-- Weather Section -->
            <section class="card weather-card" id="weather-section">
                <div class="card-header">
                    <h2>Live Weather & Score</h2>
                    <span class="badge live-badge">Active</span>
                </div>
                
                <div id="weatherContent" class="weather-content">
                    <div class="loading-spinner">Loading weather metrics...</div>
                </div>

                <div class="suitability-box" id="suitabilityBox">
                    <div class="suitability-header">
                        <span>Outdoor Activity Score</span>
                        <span id="scoreValue" class="score-num">--%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="scoreBar" class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                    <p id="recommendationText" class="recommendation-text">Calculating score...</p>
                </div>

                <div class="forecast-container">
                    <h3>5-Hour Outlook</h3>
                    <div id="hourlyList" class="hourly-list"></div>
                </div>
            </section>

            <!-- Tasks Section -->
            <section class="card tasks-card" id="tasks-section">
                <div class="card-header">
                    <h2>My Tasks & Activities</h2>
                    <div class="filter-group">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="outdoor">Outdoor</button>
                        <button class="filter-btn" data-filter="indoor">Indoor</button>
                    </div>
                </div>

                <form id="addTaskForm" class="add-task-form">
                    <div class="form-row">
                        <input type="text" id="taskTitle" placeholder="Add a new task..." required>
                        <select id="taskCategory">
                            <option value="Fitness">Fitness 🏃</option>
                            <option value="Chores">Chores 🧹</option>
                            <option value="Work">Work 💼</option>
                            <option value="Social">Social ☕</option>
                        </select>
                    </div>
                    <div class="form-row secondary-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="taskOutdoor" checked>
                            <span>Outdoor Activity</span>
                        </label>
                        <button type="submit" class="btn-primary">+ Add Task</button>
                    </div>
                </form>

                <div class="tasks-container">
                    <ul id="taskList" class="task-list"></ul>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2026 Anas Mehfooz | DLBCSPJWD01 Course Project</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
